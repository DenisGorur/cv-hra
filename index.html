<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Denis – ASCII životopis</title>
<style>
  :root { --bg:#07060d; --panel:#11101c; --line:#2a2840; --fg:#d9d6f0; --dim:#6e6a96; --acc:#7fdcff; --ok:#7dffa1; --warn:#ffb84d; }
  * { box-sizing: border-box; }

  #touch { display:none; position:absolute; left:0; right:0; bottom:0; height:46%; pointer-events:none;
           padding:0 max(10px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-bottom)); }
  body.is-touch #touch { display:block; }
  body.is-touch { padding:0 0 16px; gap:10px; }
  body.is-touch #wrap { max-width:min(880px, calc(100vh * 880 / 520)); max-width:min(880px, calc(100dvh * 880 / 520)); }
  body.is-touch .keys { display:none; }
  body.is-touch canvas { touch-action:none; }
  .tpad { position:absolute; bottom:max(8px, env(safe-area-inset-bottom)); display:flex; gap:10px; pointer-events:none; }
  .tpad.left { left:max(10px, env(safe-area-inset-left)); } .tpad.right { right:max(10px, env(safe-area-inset-right)); align-items:flex-end; }
  .tbtn { pointer-events:auto; width:62px; height:62px; border-radius:50%; border:2px solid rgba(127,220,255,.55);
          background:rgba(17,16,28,.45); color:#d9f4ff; font:bold 20px Consolas, monospace; display:flex; align-items:center; justify-content:center;
          user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
  .tbtn.on { background:rgba(127,220,255,.35); border-color:#7fdcff; }
  .tbtn.big { width:74px; height:74px; font-size:15px; }
  .tbtn.small { width:48px; height:48px; font-size:14px; }
  #tC { position:absolute; top:6px; right:max(10px, env(safe-area-inset-right)); pointer-events:auto; width:auto; height:30px; border-radius:15px; padding:0 12px; font-size:12px; }
  #rotate { display:none; position:fixed; inset:0; background:#07060d; color:#d9d6f0; z-index:50; align-items:center; justify-content:center;
            flex-direction:column; gap:14px; font-size:16px; text-align:center; padding:24px; }
  #rotate .ph { font-size:46px; animation:rot 2s ease-in-out infinite; }
  @keyframes rot { 0%,30% { transform:rotate(0) } 60%,100% { transform:rotate(90deg) } }
  @media (orientation: portrait) { body.is-touch.in-game #rotate { display:flex; } }
  canvas { display:block; width:100%; height:auto; background:var(--bg); border:1px solid var(--line); }
  .keys { font-size:12px; color:var(--dim); text-align:center; max-width:880px; line-height:1.6; }
  .keys b { color:var(--acc); font-weight:normal; }

  .modal { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,4,10,.72); }

  .box pre { white-space:pre-wrap; margin:0 0 14px; font:inherit; font-size:15px; line-height:1.5; }

  .go-row { justify-content:center; }

  #cv { width:100%; max-width:880px; background:var(--panel); border:1px solid var(--line); padding:16px 20px; }
  #cv h2 { margin:0 0 14px; font-size:13px; letter-spacing:.2em; color:var(--dim); font-weight:normal; }
  .sec { margin:0 0 14px; }
  .sec h4 { margin:0 0 4px; color:var(--acc); font-size:13px; letter-spacing:.15em; font-weight:normal; }
  .sec pre { margin:0; white-space:pre-wrap; font:inherit; font-size:14px; line-height:1.5; }
  .sec.locked h4, .sec.locked pre { color:#3d3a60; }
  .pdfbtn { color:#ffd25e !important; }
  #printCv { display:none; }
  @media print {
    body > *:not(#printCv) { display:none !important; }
    body { background:#fff !important; color:#000 !important; padding:0 !important; display:block !important; }
    #printCv { display:block !important; font-family: Georgia, "DejaVu Serif", serif; color:#000; }
    #printCv h1 { font-size:22pt; margin:0 0 4pt; } #printCv .sub { font-size:11pt; margin:0 0 14pt; color:#333; }
    #printCv h2 { font-size:12pt; letter-spacing:.08em; border-bottom:1px solid #999; margin:14pt 0 6pt; padding-bottom:2pt; }
    #printCv pre { font-family: inherit; white-space:pre-wrap; font-size:10.5pt; line-height:1.45; margin:0; }
  }

<script>
// =====================================================================
//  ZDE UPRAV SVŮJ ŽIVOTOPIS

//  Každá sekce = { nadpis, radky }. Řádky drž do cca 46 znaků.
//  Pořadí sekcí = pořadí místností ve hře (5 sekcí = 5 úloh).
// =====================================================================
const CV = {

      "- picker: vyskladňování a péče o květiny",

      "Teď se učím: JavaScript a automatizaci testů"
    ]},
    { nadpis: "JAZYKY A VZDĚLÁNÍ", radky: [
      "Čeština     rodilý mluvčí",
      "Angličtina  pokročilý (B2)",

    ]},

      "",

    ]}
  ]
};
// kontakt je v kódu zakódovaný (ochrana před roboty), složí se až po kliknutí
const KONTAKT = { e: "emMubWFuemVzQHJ1cm9nc2luZWQ=", t: "MDcxIDE3MSA3MzcgMDI0Kw==" };
const dekoduj = x => [...new TextDecoder().decode(Uint8Array.from(atob(x), c => c.charCodeAt(0)))].reverse().join("");
// ---------- stažení CV v PDF ----------
// 1) Pokud je vedle index.html soubor PDF_SOUBOR (nahraný do repozitáře), stáhne se ten.
// 2) Jinak se otevře tisk, kde jde zvolit „Uložit jako PDF“ (funguje na PC, Androidu i iOS).
const PDF_SOUBOR = "zivotopis-denis-gorur.pdf";
async function stahnoutPdf() {
  try {
    const r = await fetch(PDF_SOUBOR, { method: "HEAD", cache: "no-store" });
    if (r.ok) { const a = document.createElement("a"); a.href = PDF_SOUBOR; a.download = PDF_SOUBOR; document.body.appendChild(a); a.click(); a.remove(); return; }
  } catch (_) {}
  const el = document.getElementById("printCv"); el.innerHTML = "";
  const h = document.createElement("h1"); h.textContent = CV.jmeno;
  const sub = document.createElement("p"); sub.className = "sub";
  sub.textContent = "Test Engineer · ✉ " + dekoduj(KONTAKT.e) + " · ☎ " + dekoduj(KONTAKT.t);
  el.append(h, sub);
  CV.sekce.forEach(s => {
    const t = document.createElement("h2"); t.textContent = s.nadpis;
    const pre = document.createElement("pre");
    pre.textContent = s.radky.filter(r => !/Zobrazit kontakt|v panelu pod hrou/.test(r)).join("\n");
    el.append(t, pre);
  });
  const old = document.title; document.title = "Životopis – " + CV.jmeno;
  setTimeout(() => { window.print(); document.title = old; }, 50);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-pdf]"); if (b) { e.preventDefault(); stahnoutPdf(); } });
function kontaktEl() {
  const wrap = document.createElement("div"); wrap.style.margin = "8px 0 4px";
  const b = document.createElement("button"); b.textContent = "✉ ☎  Zobrazit kontakt";
  b.onclick = () => {
    const e = dekoduj(KONTAKT.e), t = dekoduj(KONTAKT.t);
    wrap.innerHTML = "";
    const a = document.createElement("a"); a.href = "mailto:" + e; a.textContent = "✉ " + e; a.style.color = "#7fdcff";
    const c = document.createElement("a"); c.href = "tel:" + t.replace(/\s/g, ""); c.textContent = "☎ " + t; c.style.color = "#7fdcff";
    wrap.append(a, document.createElement("br"), c);
  };
  wrap.appendChild(b); return wrap;
}
const NS = CV.sekce.length; // 6 sekcí = 6 úloh

const ROOM_NAMES = ["Vstupní síň", "Testovací laboratoř", "Archiv praxe", "Dílna dovedností", "Knihovna", "Petřín", "Síň životopisu"];

// =====================================================================
//  ENGINE
// =====================================================================
const CW = 11, CH = 20, VC = 80, VR = 26, H = 26, ROOM = 60, NR = 7, W = ROOM * NR;
const FONT = '17px Consolas, "DejaVu Sans Mono", "Courier New", monospace';
const C = { bg:"#07060d", fg:"#d9d6f0", acc:"#7fdcff", ok:"#7dffa1", warn:"#ffb84d", gate:"#b47cff", enemy:"#ff5c7a" };

const cvs = document.getElementById("game"), ctx = cvs.getContext("2d");
const DPR = Math.min(2, window.devicePixelRatio || 1);
cvs.width = VC * CW * DPR; cvs.height = VR * CH * DPR;
ctx.scale(DPR, DPR);
ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";

const rnd = (() => { let a = 1337; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- svět ----------
const grid = [], decor = [], decorCol = [];
for (let y = 0; y < H; y++) { grid.push(Array(W).fill(" ")); decor.push(Array(W).fill(" ")); decorCol.push(Array(W).fill(null)); }
function rect(x, y, w, h, ch) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (j >= 0 && j < H && i >= 0 && i < W) grid[j][i] = ch; }
const P = (x, y, w) => rect(x, y, w, 1, "=");

rect(0, 0, W, 2, "#"); rect(0, 24, W, 2, "#"); rect(0, 0, 2, H, "#"); rect(W - 2, 0, 2, H, "#");
for (let r = 0; r < NS; r++) rect((r + 1) * ROOM - 1, 2, 1, 22, "‖");

P(14, 20, 8); P(26, 17, 8); P(38, 20, 6);                               // místnost 0
P(66, 19, 10); P(80, 15, 10); P(94, 19, 8); rect(88, 22, 2, 2, "#");    // místnost 1
P(128, 20, 6); P(136, 17, 6); P(144, 14, 7); P(153, 17, 6); P(161, 20, 6); // místnost 2
P(186, 19, 6); P(224, 19, 6);                                           // místnost 3
// místnost 4: schody přes inkoust s rébusem (slovo CAT) a kočičkou nahoře
const INK_X0 = 248, INK_X1 = 291;
rect(INK_X0, 24, INK_X1 - INK_X0 + 1, 2, " ");
const RB = { word: "CAT", progress: 0, falls: 0, easy: false, w: 4, plats: [
  { x: 250, y: 21, ch: "K" }, { x: 256, y: 21, ch: "C", ok: true },        // 1. schod
  { x: 262, y: 18, ch: "O" }, { x: 268, y: 18, ch: "A", ok: true },        // 2. schod
  { x: 274, y: 15, ch: "T", ok: true }, { x: 280, y: 15, ch: "E" }         // 3. schod
].map(q => ({ ...q, shake: 0, gone: false })) };
const rbPlace = q => rect(q.x, q.y, RB.w, 1, "=");
RB.plats.forEach(rbPlace);
P(283, 12, 9);                                                           // 4. schod s kočičkou
// srdíčka: v každé úrovni jedno (kromě úvodní a té s kočičkou), každé doplní 1 život
const HEART_PICKUPS = [{ x: 85, y: 13 }, { x: 147, y: 12 }, { x: 226, y: 17 }, { x: 324, y: 14 }].map(h => ({ ...h, taken: false }));
const CAT = { cx: 288.5, y: 12, happy: 0 };      // cx = střed kočky (v buňkách), y = řádek plošiny
P(312, 19, 6); P(322, 16, 6);                                           // místnost 5
P(372, 19, 6); P(400, 19, 6);                                           // místnost 6

// =====================================================================
//  PROSTŘEDÍ MÍSTNOSTÍ
//  Každá místnost má vlastní téma: vzdálené pozadí (paralaxa), střední vrstvu,
//  světla a animace. Pozadí se jednou nakreslí z tvarů a převede na drobné ASCII znaky.
// =====================================================================
const LAYER_H = 24 * CH, ROOM_PX = ROOM * CW, FAR_W = 1400, FAR_PAD = (FAR_W - ROOM_PX) / 2;
const BG_TS = 3, BTW = CW / BG_TS, BTH = CH / BG_TS;
const BG_FONT = `${Math.round(BTH * 1.1)}px Consolas, "DejaVu Sans Mono", monospace`;
function srand(seed) { let a = seed * 9973 + 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rpick = (R, a) => a[Math.floor(R() * a.length)];
const G = {
  lin(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); for (const [o, col] of stops) g.addColorStop(o, col); return g; },
  rect(c, x, y, w, h, f) { c.fillStyle = f; c.fillRect(x, y, w, h); },
  circ(c, x, y, r, f) { c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); },
  ell(c, x, y, rx, ry, f) { c.fillStyle = f; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); },
  poly(c, p, f) { c.fillStyle = f; c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); c.fill(); },
  line(c, x1, y1, x2, y2, w, s) { c.strokeStyle = s; c.lineWidth = w; c.lineCap = "round"; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); },
  ring(c, x, y, r, w, s) { c.strokeStyle = s; c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); },
  text(c, t, x, y, size, f) { c.fillStyle = f; c.font = `bold ${size}px Georgia, "DejaVu Serif", serif`; c.textAlign = "left"; c.textBaseline = "top"; c.fillText(t, x, y); }
};
function gear(c, x, y, r, col, hole) {

function nearestInter() {
  const p = player, pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  let best = null, bd = 1e9;
  for (const it of inter) {
    const ix = (it.x + 1.5) * CW, iy = (it.y + (it.type === "lever" ? 0.5 : 1.5)) * CH;
    const dx = Math.abs(ix - pcx), dy = Math.abs(iy - pcy);
    if (dx < (it.type === "cat" ? 6 : 2.2) * CW && dy < 2.6 * CH && dx < bd) { bd = dx; best = it; }
  }

}
function interact(it) {
  if (it.type === "lever") {
    const g = levers[it.g];
    if (g.done) return;
    g.tries = (g.tries || 0) + 1;
    let ok = false;
    switch (g.kind) {
      case "allon": g.state[it.i] ^= 1; ok = g.state.every(v => v); break;
      case "pattern": g.state[it.i] ^= 1; ok = g.state.every((v, k) => v === g.target[k]); break;
      case "lightsout":
        for (const k of [it.i - 1, it.i, it.i + 1]) if (k >= 0 && k < g.state.length) g.state[k] ^= 1;
        ok = g.state.every(v => v); break;
      case "order": {
        const sym = g.syms[it.i];
        if (g.pressed.includes(sym)) return;
        if (sym === g.order[g.pressed.length]) { g.pressed.push(sym); ok = g.pressed.length === g.order.length; }
        else { g.pressed = []; g.fail = 30; shake = 4; floatText("Špatné pořadí – znovu", it.x - 8, it.y - 2, C.enemy); }
        break;
      }
      case "dial": g.state[it.i] = (g.state[it.i] + 1) % 4; ok = g.state.every(v => v === 0); break;
      case "sum": g.state[it.i] ^= 1; ok = groupSum(g) === g.target; break;
    }
    spawn((it.x + 1.5) * CW, (it.y + 0.5) * CH, 8, { ch: ["*", "+", "."], col: C.warn, speed: 2 });
    if (ok) { g.done = true; delayFn = { t: 35, fn: () => solveRoom(g.room) }; }
    else if (g.tries === 8) floatText(g.tip, it.x - 8, it.y - 2, C.ok);
    else if (g.tries >= 14) {
      g.done = true; floatText("Pomůžu vám :)", it.x - 3, it.y - 2, C.ok);
      if (g.kind === "pattern") g.state = [...g.target];
      else if (g.kind === "order") g.pressed = [...g.order];
      else if (g.kind === "dial") g.state = g.state.map(() => 0);
      else if (g.kind === "sum") g.state = [...g.solution];
      else g.state = g.state.map(() => 1);
      delayFn = { t: 50, fn: () => solveRoom(g.room) };
    }
  } else if (it.type === "cat") {
    if (player.pet > 0) return;
    if (solved[4]) { CAT.happy = 90; floatText("prrr ♥", CAT.cx - 1, CAT.y - 4, "#ffb3c8"); }
    else if (RB.progress < RB.word.length) floatText("Mňau? Nejdřív složte slovo.", CAT.cx - 12, CAT.y - 4, C.warn);
    else { player.pet = 80; player.face = 1; if (player.hp < 5) floatText("Životy doplněny ♥♥♥♥♥", CAT.cx - 9, CAT.y - 6, "#ff8fb1"); player.hp = 5; player.x = (CAT.cx - 4.3) * CW - player.w / 2; player.vx = 0; CAT.happy = 160; floatText("prrr ♥", CAT.cx - 1, CAT.y - 4, "#ffb3c8"); }
  } else if (it.type === "cv") {
    if (solved.every(Boolean)) openInfo("ŽIVOTOPIS // " + CV.jmeno.toUpperCase(), fullCvText());
    else floatText("Nejdřív složte celý životopis", it.x - 8, it.y - 1, C.warn);
  }
}

// ---------- skládání textu z ASCII světa ----------
function startCine(lines, onEnd, accent = 1) {
  const maxLen = Math.max(...lines.map(l => [...l].length));
  const sc = Math.floor((VC - maxLen) / 2), sr = Math.floor((VR - lines.length) / 2);
  const c0 = Math.floor(camX / CW), off = camX - c0 * CW, src = [];
  for (let sx = 0; sx <= VC; sx++) for (let cy = 2; cy < 24; cy++) {
    const cx = c0 + sx; if (cx < 0 || cx >= W) continue;
    const ch = grid[cy][cx] !== " " ? grid[cy][cx] : decor[cy][cx];
    if (ch !== " ") src.push({ x: sx * CW - off, y: cy * CH, ch, key: cx * 100 + cy });
  }
  const parts = [];
  lines.forEach((l, j) => [...l].forEach((ch, i) => {
    if (ch === " ") return;
    const s = src.length ? src.splice(Math.floor(Math.random() * src.length), 1)[0] : { x: Math.random() * VC * CW, y: Math.random() * VR * CH, ch: "#" };
    if (s.key !== undefined) hidden.add(s.key);
    parts.push({ sx: s.x, sy: s.y, sch: s.ch, tx: (sc + i) * CW, ty: (sr + j) * CH, ch, acc: j < accent,
      delay: Math.random() * 35 + j * 5, dur: 45 + Math.random() * 35, arc: (Math.random() - 0.5) * 180 });
  }));
  const end = Math.max(...parts.map(p => p.delay + p.dur));
  cine = { parts, t: 0, end, sc, sr, maxLen, n: lines.length, onEnd };
}
function updateCine() {
  cine.t++;
  if (cine.t > cine.end + 10 && (pressed.KeyE || pressed.Enter || pressed.Space)) {
    const f = cine.onEnd; cine = null; hidden.clear(); f && f();
  }
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------- postavička z drobných ASCII znaků ----------

function seg(x1, y1, x2, y2, w, col) {

function leg(hx, hy, a, k, col) {               // a = úhel stehna (0 = dolů, + = dopředu), k = ohnutí kolena

function playerPose(p) {

    o.legF = [sn * 0.75, 0.25 + Math.max(0, -sn) * 1.0]; o.legB = [-sn * 0.75, 0.25 + Math.max(0, sn) * 1.0];
    o.armB = -sn * 0.9; o.lean = 0.12; o.bob = -Math.abs(Math.cos(ph)) * 2.5;

}
function renderPlayerSprite(p) {
  pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, SCOLS, SROWS);
  pctx.setTransform(p.face / TW, 0, 0, 1 / TH, SCOLS / 2, SROWS - 0.6);   // souřadnice v px, chodidla v (0,0)
  if (p.roll > 0) {
    const r = p.roll * 0.45;
    pctx.fillStyle = PC.coat; pctx.beginPath(); pctx.arc(0, -15, 15, 0, Math.PI * 2); pctx.fill();
    pctx.fillStyle = PC.hair; pctx.beginPath(); pctx.arc(0, -15, 15, r, r + 2.2); pctx.lineTo(0, -15); pctx.fill();
    seg(Math.cos(r + 3) * 12, -15 + Math.sin(r + 3) * 12, Math.cos(r + 4) * 12, -15 + Math.sin(r + 4) * 12, 4, PC.collar);
  } else {
    const o = playerPose(p);
    pctx.translate(0, o.bob); pctx.scale(0.85, 0.85);                     // celkově menší postava
    const hipX = 0, hipY = -30;

    const bh = [shX - 2 + Math.sin(o.armB) * 18, shY + 2 + Math.cos(o.armB) * 18];
    seg(shX - 3, shY + 2, bh[0], bh[1], 6, PC.backArm);                            // zadní ruka
    pctx.fillStyle = PC.face; pctx.beginPath(); pctx.arc(bh[0], bh[1], 2.6, 0, 7); pctx.fill();
    // trup (kabát) s cípy
    pctx.save(); pctx.translate(hipX, hipY); pctx.rotate(o.lean);
    pctx.fillStyle = PC.coat; pctx.beginPath();
    pctx.moveTo(-9, -26); pctx.lineTo(9, -26); pctx.lineTo(11, 2); pctx.lineTo(13, 8); pctx.lineTo(-13, 8); pctx.lineTo(-11, 2); pctx.closePath(); pctx.fill();
    pctx.fillStyle = PC.belt; pctx.fillRect(-10, -3, 20, 3.5);
    pctx.fillStyle = PC.collar; pctx.fillRect(-8, -27, 17, 4); pctx.fillRect(-1, -26, 4, 12);
    pctx.restore();
    leg(hipX + 2, hipY, o.legF[0], o.legF[1], PC.pants);                        // přední noha
    // hlava: krátké vlasy, tmavé brýle, úšklebek
    const HS = 0.55;                                                                                // velikost hlavy vůči tělu
    seg(shX + 1, shY + 1, shX + 2, shY - 3, 5, PC.faceD);                                           // krk
    pctx.save(); pctx.translate(shX + 2.5, shY - 3 - 12 * HS); pctx.scale(HS, HS);
    const hx = 0, hy = 0;
    pctx.fillStyle = PC.face; pctx.beginPath(); pctx.ellipse(hx + 1, hy, 11, 12.5, 0, 0, 7); pctx.fill();
    pctx.beginPath(); pctx.ellipse(hx + 11, hy + 2.5, 2.4, 3, 0, 0, 7); pctx.fill();                // nos
    pctx.beginPath(); pctx.ellipse(hx + 5, hy + 10, 7, 3.5, 0.2, 0, 7); pctx.fill();               // brada
    pctx.fillStyle = PC.beard;                                                                      // plnovous s kotletami
    pctx.beginPath(); pctx.moveTo(hx - 1, hy - 3); pctx.lineTo(hx + 2, hy - 2); pctx.lineTo(hx + 3, hy + 4.5);
    pctx.lineTo(hx + 12.5, hy + 4); pctx.lineTo(hx + 13, hy + 8); pctx.lineTo(hx + 10, hy + 14.5); pctx.lineTo(hx + 2, hy + 15);
    pctx.lineTo(hx - 3.5, hy + 9); pctx.lineTo(hx - 4.5, hy + 3); pctx.closePath(); pctx.fill();
    pctx.fillStyle = PC.beardD; pctx.beginPath(); pctx.ellipse(hx + 9, hy + 5, 4.2, 1.6, -0.1, 0, 7); pctx.fill();   // knír
    pctx.fillStyle = PC.faceD; pctx.beginPath(); pctx.ellipse(hx - 3, hy + 1.5, 2.6, 3.6, 0, 0, 7); pctx.fill(); // ucho
    pctx.fillStyle = PC.hair;                                                                       // vlasy
    pctx.beginPath(); pctx.ellipse(hx - 0.5, hy - 5, 11.8, 8.5, -0.15, Math.PI * 0.92, Math.PI * 2.04); pctx.fill();
    pctx.beginPath(); pctx.moveTo(hx - 11, hy - 5); pctx.lineTo(hx - 2, hy - 10); pctx.lineTo(hx - 5, hy + 4); pctx.lineTo(hx - 10.5, hy + 5); pctx.fill();
    pctx.fillStyle = PC.glasses;                                                                    // brýle
    pctx.beginPath(); pctx.moveTo(hx + 1, hy - 3.5); pctx.lineTo(hx + 12.5, hy - 4.5); pctx.lineTo(hx + 11.5, hy + 1.5);
    pctx.lineTo(hx + 7, hy + 2.5); pctx.lineTo(hx + 2, hy + 1.5); pctx.closePath(); pctx.fill();

    seg(fh[0] - Math.sin(o.ham) * 4, fh[1] - Math.cos(o.ham) * 4, he[0], he[1], 3.2, PC.wood);

  pctx.fillStyle = g; pctx.fillRect(0, 0, SCOLS, SROWS);
  pctx.globalCompositeOperation = "source-over";
  return pctx.getImageData(0, 0, SCOLS, SROWS).data;
}
// převod malého obrázku na drobné ASCII znaky (tint = barevný nádech, null = šedá)
function asciiDraw(d, cols, rows, x0, y0, tint, flash) {
  ctx.font = TINY_FONT;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = (j * cols + i) * 4, a = d[k + 3] / 255;
    if (a < 0.1) continue;
    const lum = (0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]) / 255;
    const v = a * (0.3 + 0.7 * lum);
    const ch = RAMP[clamp(Math.round(v * (RAMP.length - 1)), 1, RAMP.length - 1)];
    ctx.globalAlpha = Math.min(1, a * 1.3);
    if (flash) ctx.fillStyle = "#ffffff";
    else if (tint === "rgb") ctx.fillStyle = `rgb(${Math.min(255, d[k] * 1.08 + 12)},${Math.min(255, d[k + 1] * 1.08 + 12)},${Math.min(255, d[k + 2] * 1.08 + 12)})`;

      const m = clamp(lum * 1.35 + 0.08, 0, 1.6), w = Math.max(0, lum - 0.85) * 4;   // nejsvětlejší místa do běla
      ctx.fillStyle = `rgb(${Math.round(Math.min(255, tint[0] * m + w * 200))},${Math.round(Math.min(255, tint[1] * m + w * 200))},${Math.round(Math.min(255, tint[2] * m + w * 200))})`;
    } else {
      const gr = Math.round(clamp(lum * 255 * 1.15 + 20, 0, 255));
      ctx.fillStyle = `rgb(${gr},${gr},${gr})`;
    }
    ctx.fillText(ch, x0 + (i + 0.5) * TW, y0 + (j + 0.5) * TH);
  }
  ctx.globalAlpha = 1; ctx.font = FONT;
}

// ---------- kočička ve stejném stylu ----------
const KCOLS = 56, KROWS = 19;
const kcv = document.createElement("canvas"); kcv.width = KCOLS; kcv.height = KROWS;
const kctx = kcv.getContext("2d", { willReadFrequently: true });
const CAT_TINT = "rgb";                                              // vlastní barvy (ragdoll)
// bílá chlupatá ragdoll: krémové tělo, tmavší "odznaky" (obličej, uši, ocas), modré oči, bílé tlapky
const RAG = { fur: "#f3eee4", ruff: "#ffffff", shade: "#d8d0c2", point: "#9a7c64", pointL: "#c2a68c", eye: "#4aa6ff", nose: "#e8a0a0" };
const FLUFF = (() => { const R = srand(77); return Array.from({ length: 40 }, () => [R(), R(), R()]); })();
function fluffy(c, x, y, rx, ry, col, n, size, off) {
  c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill();
  for (let i = 0; i < n; i++) {
    const f = FLUFF[(i + off) % FLUFF.length], a = (i / n) * Math.PI * 2 + f[0] * 0.3;
    c.beginPath(); c.arc(x + Math.cos(a) * rx * 0.95, y + Math.sin(a) * ry * 0.95, size * (0.7 + f[1] * 0.6), 0, 7); c.fill();
  }
}
function renderCat(happy) {
  const c = kctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, KCOLS, KROWS);
  c.setTransform(-1 / TW, 0, 0, 1 / TH, KCOLS / 2, KROWS - 0.6);     // natočená doleva (k hráči), tlapky v (0,0)
  c.scale(1.3, 1.3);
  const breathe = Math.sin(tick * 0.06) * 0.6, sway = Math.sin(tick * (happy ? 0.22 : 0.06)) * (happy ? 6 : 4);
  const ln = (x1, y1, x2, y2, w, col) => { c.strokeStyle = col; c.lineWidth = w; c.lineCap = "round"; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  // huňatý ocas (do tmava ke špičce)
  const tp = t => { const u = 1 - t; return [u * u * -16 + 2 * u * t * -42 + t * t * (-34 + sway), u * u * -8 + 2 * u * t * -6 + t * t * (-30)]; };
  for (let i = 0; i <= 10; i++) { const t = i / 10, [x, y] = tp(t);
    c.fillStyle = t < 0.55 ? RAG.fur : t < 0.8 ? RAG.pointL : RAG.point;
    c.beginPath(); c.arc(x, y, 7 - t * 1.5 + (FLUFF[i][2] - 0.5) * 1.4, 0, 7); c.fill(); }
  // chlupaté tělo, náprsenka (límec), stín pod bříškem
  fluffy(c, -4, -12, 16, 11.5 + breathe, RAG.fur, 18, 3.2, 0);
  c.fillStyle = RAG.shade; c.beginPath(); c.ellipse(-6, -4, 13, 3.5, 0, 0, 7); c.fill();
  fluffy(c, 6, -13, 8, 10 + breathe, RAG.ruff, 12, 3, 9);
  // bílé "rukavičky" tlapek
  c.fillStyle = RAG.fur; c.fillRect(3, -8, 4.5, 7); c.fillRect(9, -8, 4.5, 7);
  c.fillStyle = RAG.ruff; c.beginPath(); c.ellipse(5.2, -1, 3.4, 1.9, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(11.2, -1, 3.4, 1.9, 0, 0, 7); c.fill();
  // hlava
  const tilt = happy ? Math.sin(tick * 0.1) * 1.2 : 0;
  c.save(); c.translate(10, -27 + breathe * 0.5); c.rotate(happy ? 0.12 : 0);
  c.fillStyle = RAG.point;                                                                  // tmavá ouška
  c.beginPath(); c.moveTo(-8, -3); c.lineTo(-6, -14 + tilt); c.lineTo(-1, -7); c.fill();
  c.beginPath(); c.moveTo(1, -7); c.lineTo(6, -14 - tilt); c.lineTo(9, -2); c.fill();
  fluffy(c, 0, 1, 10, 9, RAG.fur, 14, 2.4, 20);                                             // chlupaté tváře
  c.fillStyle = RAG.pointL; c.beginPath(); c.ellipse(2.5, 0, 6.5, 6, 0, 0, 7); c.fill();       // maska
  c.fillStyle = RAG.point; c.beginPath(); c.ellipse(3.5, 1, 4, 3.5, 0, 0, 7); c.fill();
  c.fillStyle = RAG.ruff; c.beginPath(); c.ellipse(4.5, 4.5, 4.5, 2.6, 0, 0, 7); c.fill();     // světlý čumáček
  c.fillStyle = RAG.nose; c.beginPath(); c.arc(7, 2.4, 1.3, 0, 7); c.fill();
  if (happy || tick % 170 < 8) ln(1.5, -2.2, 5, -1.8, 1.3, "#2a2a2a");                         // zavřená očka
  else { c.fillStyle = RAG.eye; c.beginPath(); c.ellipse(3.6, -2, 2, 2.4, 0, 0, 7); c.fill();
         c.fillStyle = "#10203a"; c.beginPath(); c.ellipse(4, -2, 0.8, 1.6, 0, 0, 7); c.fill();
         c.fillStyle = "#ffffff"; c.fillRect(3.2, -3.6, 0.9, 0.9); }
  for (const dy of [-0.5, 1.5]) ln(8, 3.5, 15, 3.5 + dy * 1.5, 0.7, "#ffffff");               // vousky
  c.restore();
  // světlo zepředu shora
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = "source-atop";
  const g = c.createLinearGradient(0, 0, KCOLS, KROWS);
  g.addColorStop(0, "rgba(255,255,255,0.15)"); g.addColorStop(0.6, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.35)");
  c.fillStyle = g; c.fillRect(0, 0, KCOLS, KROWS);
  c.globalCompositeOperation = "source-over";
  return c.getImageData(0, 0, KCOLS, KROWS).data;
}

  c.strokeStyle = "#6a6a6a"; c.lineWidth = 1.4;                                   // rýhy na krovkách
  for (const r of [7, 13]) { c.beginPath(); c.ellipse(-3, -16 + bob, r, r * 0.65, 0, Math.PI * 1.05, Math.PI * 1.95); c.stroke(); }
  c.fillStyle = "#4a4a4a"; c.fillRect(-20, -17 + bob, 34, 1.6);                  // spodní okraj krunýře
  // hlava, oko, kusadla, tykadla

  if (done && tick % 50 < 34) {
    const s = isTouch ? (mode === "title" ? "[ klepněte ] start" : "[ klepněte ] pokračovat") : (mode === "title" ? "[ ENTER ] start" : "[ E / ENTER ] pokračovat");
    text(s, Math.floor((VC - s.length) / 2) * CW, (k.sr + k.n + 3) * CH, C.warn);
  }
}

// ---------- start ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
document.getElementById("skipBtn").onclick = () => {
  for (let i = 0; i < NS; i++) solved[i] = true;
  renderPanel(); document.getElementById("cv").scrollIntoView({ behavior: "smooth" });
};
renderPanel();
startCine([
  " #####   #       #",
  "#         #     # ",
  "#          #   #  ",
  "#           # #   ",
  " #####       #    ",
  "",
  "D E N I S   G Ö R Ü R",
  "interaktivní životopis v ASCII",
  "",
  MOBILE_OS ? "◀ ▶ = chůze · SKOK · ⚒ = kladivo · E = použít" : "šipky = chůze · mezerník = skok · X = kladivo · E = použít"
], () => { mode = "play"; roomTitle = { t: ROOM_NAMES[0], life: 150 }; }, 5);
requestAnimationFrame(loop);

window.__dbg = { cam: () => camX, wb: () => wallBend, solveRoom, player, enemies, boss: BOSS, cam: () => camX, state: () => ({ mode, cine: !!cine, solved: [...solved], room: curRoom }) };
</script>
